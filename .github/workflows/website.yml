name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Scripts/install.sh"
      - "wrangler.jsonc"
      - "edge/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Prepare installer
        run: cp Scripts/install.sh site/public/install.sh
      - name: Install site dependencies
        run: npm ci --prefix site
      - name: Build site
        run: npm run build --prefix site
      - name: Verify build output
        run: |
          test -f site/dist/index.html
          test -f site/dist/zh/index.html
          test -f site/dist/docs/index.html
          test -f site/dist/zh/docs/index.html
          test -f site/dist/latest.json
          test -f site/dist/install.sh
          test -f site/dist/privacy/index.html
          test -f site/dist/security/index.html
          test -f site/dist/support/index.html
          test -f site/dist/press/index.html
          test -f site/dist/changelog/index.html
          test -f site/dist/zh/privacy/index.html
          test -f site/dist/zh/security/index.html
          test -f site/dist/zh/support/index.html
          test -f site/dist/zh/press/index.html
          test -f site/dist/zh/changelog/index.html
          test -f site/dist/.well-known/security.txt
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --prefix site -- wrangler deploy
      - name: Smoke production
        run: |
          curl --retry 5 --retry-delay 2 --fail --silent --show-error https://remige.app/ | grep -F "Every update."
          curl --retry 5 --retry-delay 2 --fail --silent --show-error https://remige.app/zh/ | grep -F "所有更新"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error https://remige.app/latest.json | grep -F '"version"'
          curl --retry 5 --retry-delay 2 --fail --silent --show-error https://remige.app/install.sh | grep -F "Remige installer"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error https://remige.app/changelog/ | grep -F "Changelog"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error https://remige.app/privacy/ | grep -F "Privacy"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error https://remige.app/security/ | grep -F "Security"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error https://remige.app/.well-known/security.txt | grep -F "Contact:"
