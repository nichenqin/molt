name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build universal app
        run: ARCHS=universal VERSION="${GITHUB_REF_NAME#v}" Scripts/package.sh
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Molt-macos.zip
            dist/molt-cli
            dist/Molt-macos.zip.sha256
