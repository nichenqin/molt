name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Lint
        run: xcrun swift-format lint --recursive Sources Tests
      - name: Website files
        run: |
          test -f site/index.html
          test -f site/zh/index.html
          test -f site/latest.json
      - name: Package app
        run: ARCHS=arm64 Scripts/package.sh
      - name: Smoke test
        run: |
          dist/remige doctor --json
          dist/remige list --cached --json || true
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: remige-arm64
          path: |
            dist/Remige-macos.zip
            dist/Remige-macos.dmg
            dist/remige-cli
