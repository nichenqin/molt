name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Lint
        run: xcrun swift-format lint --recursive Sources Tests
      - name: Package app
        run: ARCHS=arm64 Scripts/package.sh
      - name: Smoke test
        run: |
          dist/remige doctor --json
          dist/remige list --cached --json || true
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: remige-arm64
          path: |
            dist/Remige-macos.zip
            dist/Remige-macos.dmg
            dist/remige-cli

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        run: npm ci --prefix site
      - name: Build site
        run: npm run build --prefix site
      - name: Verify routes
        run: |
          test -f site/dist/index.html
          test -f site/dist/zh/index.html
          test -f site/dist/docs/index.html
          test -f site/dist/zh/docs/index.html
          test -f site/dist/404.html
          test -f site/dist/latest.json
          test -f site/dist/privacy/index.html
          test -f site/dist/security/index.html
          test -f site/dist/support/index.html
          test -f site/dist/press/index.html
          test -f site/dist/changelog/index.html
          test -f site/dist/zh/privacy/index.html
          test -f site/dist/zh/security/index.html
          test -f site/dist/zh/support/index.html
          test -f site/dist/zh/press/index.html
          test -f site/dist/zh/changelog/index.html
          test -f site/dist/.well-known/security.txt
          test -f site/dist/install.sh
