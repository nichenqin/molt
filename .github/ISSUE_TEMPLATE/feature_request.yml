name: Feature request
description: Suggest a source, an upgrade path, or a UI change.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow that is currently missing or painful.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Be specific about the source, command, or UI you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, workarounds, or other designs.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This does not require running arbitrary shell strings or silently replacing an app bundle.
