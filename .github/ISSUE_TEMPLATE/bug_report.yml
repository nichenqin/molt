name: Bug report
description: Something in Remige is wrong or crashes.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include API keys, tokens, or other secrets.
        For security vulnerabilities, use the private advisory link instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did Remige do instead?
      placeholder: I clicked Update and ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Remige
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Remige version
      description: Output of `remige version`, or the version in Remige → About.
      placeholder: 0.3.1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      placeholder: macOS 15.1, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was Remige installed?
      options:
        - DMG
        - One-line installer (curl)
        - Homebrew
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste `remige doctor --json` and, if the issue is about the update list, `remige list --json`.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Drag images here, or paste the exact output or error text.
